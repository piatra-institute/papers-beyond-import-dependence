- id: asml-report
  kind: source
  passage: Extreme ultraviolet lithography is supplied by one firm, whose 2025 annual report records approximately
    5,100 suppliers and 48 such systems shipped in the year, against 279 deep ultraviolet systems, down from 374
    the year before [@asml2026].
  evidence:
    citation_id: asml2026
    locator: 'Strategic report: At a glance; Business review'
    verified: true
    verification_note: 'ASML 2025 Annual Report (strategic report section PDF): 5,100 total number of suppliers;
      DUV system sales decreased from 374 units in 2024 to 279 in 2025; four EXE and 44 NXE (EUV) systems recognized
      in sales in 2025, i.e. 48.'
- id: zeiss-optics
  kind: source
  passage: 'The optics come exclusively from one supplier: more than 40,000 parts in the High-NA projection optics,
    weighing around twelve tons, more than 25,000 parts in the illumination system, a collaborating network of more
    than 1,200 members, and roughly a year to manufacture a single mirror [@zeiss2026].'
  evidence:
    citation_id: zeiss2026
    locator: High-NA-EUV lithography page
    verified: true
    verification_note: 'zeiss.com page: projection optics of more than 40,000 parts weighing twelve tons; illumination
      system of more than 25,000 parts; network of more than 1,200 members; mirrors take around a year to manufacture.'
- id: exvi-method
  kind: source
  passage: The European Commission's External Vulnerability Index, built on 2022 trade data, scores external exposure
    from import shares, supplier concentration and competitive position [@connell2025].
  evidence:
    citation_id: connell2025
