- id: def-blackbox
  kind: definition
  passage: 'A node is a strategic black box for a region, at a given horizon, performance level, production quantity,
    cost ceiling and coalition boundary, when three conditions hold together: the node gates output that matters;
    continued access can be materially influenced by firms, states, licences or routes outside the region; and the
    region or its coalition cannot credibly deliver qualified output at that performance, quantity and cost within
    that horizon after the incumbent supply stops.'
  rationale: 'Central definition: three jointly necessary conditions (criticality, external access control, no credible
    reconstitution) relative to horizon, performance, quantity, cost and coalition.'
- id: def-cells
