- id: abs-cap-rho
  kind: computation
  passage: In a model of 8 canonical node types with generative ground truth, a capability index recovers the true
    ordering of expected loss exactly (rank correlation 1.00), while import share and a concentration-weighted trade
    index correlate at −0.31 and −0.29.
  evidence:
    file: simulation/output/results.json
    run_id: model
    pointer: /detector/spearman_vs_truth/capability_burden
    reported: '1.00'
    units: Spearman rank correlation with true loss
    conditions: 'mechanism 1: 8 node types, 4000 draws per node, seed 20260816, 10-year horizon, 5% discount'
    decimals: 2
