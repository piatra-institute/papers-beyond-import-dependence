abstract: In June 2026 the sole maker of extreme ultraviolet lithography systems stated that it had never
  shipped one to China and that none of the 314 machines operating worldwide is located there [@reuters2026a].
  Trade-based dependence measures therefore score Chinese exposure to that machine as zero, and in general
  they improve when a border closes. We separate import dependence from black-box dependence. A node is
  a strategic black box for a region when it is critical, when access to it can be interrupted by others,
  and when the region cannot credibly specify, verify, modify, produce, qualify, scale, service or replace
  it at the required performance, quantity, cost and horizon. In a model of 8 canonical node types with
  generative ground truth, a capability index recovers the true ordering of expected loss exactly (rank
  correlation 1.00), while import share and a concentration-weighted trade index correlate at −0.31 and
  −0.29. Embargoing one node drops its trade index from 0.94 to 0 while its expected loss rises by a factor
  of 1.61. Treating capability as a stock, an import share of 0.5 builds capability above an absorptive
  capacity of 0.83 (without local engineering linkage) and erodes it below; the fall after hollowing takes
  14 years and the climb back to the starting level 20. Two regions with identical mean burden of 0.2375
  and opposite topology reverse their loss ranking with the type of shock, which argues against any scalar
  dependence index. The results support measuring capability and do not support closing borders.
web_blurb: Trade-based dependence indices score an embargoed machine as zero exposure. A capability index
  recovers true expected loss exactly, shows that imports build or erode capability depending on absorption,
  and argues against any scalar dependence measure.
